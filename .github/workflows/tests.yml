name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run installer tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          bash tests/setup.test.sh
          for t in \
            tests/teamdb.test.sh \
            tests/teamdb-safe-query.test.sh \
            tests/teamdb-search-sqli.test.sh \
            tests/teamdb-related-sqli.test.sh \
            tests/teamdb-problems-fts.test.sh \
            tests/teamdb-python-bindparams.test.sh \
            tests/teamdb-write-wal.test.sh \
            tests/teamdb-amend-full.test.sh \
            tests/teamdb-dag-tables-exist.test.sh \
            tests/teamdb-deps-dag.test.sh \
            tests/teamdb-claim-lease.test.sh \
            tests/teamdb-claim-strict.test.sh \
            tests/teamdb-claim-history.test.sh \
            tests/teamdb-export-md.test.sh \
            tests/teamdb-context-capsule.test.sh \
            tests/teamdb-context-issue8.test.sh \
            tests/teamdb-cycle-amended.test.sh \
            tests/teamdb-migrate-md-preserve.test.sh \
            tests/teamdb-migration-003-unique.test.sh \
            tests/teamdb-plan-atomic-idempotent.test.sh \
            tests/teamdb-execute-plan-no-shell.test.sh \
            tests/teamdb-export-audit.test.sh \
            tests/snippets-sync.test.sh \
            tests/install-resolves-snippets.test.sh \
            tests/install-platform-contract.test.sh \
            tests/commands-contract.test.sh \
            tests/teamdb-resume.test.sh \
            tests/audit-log-actor-source.test.sh \
            tests/teamdb-global-heal.test.sh \
            tests/agents-teamdb-integration.test.sh \
            tests/review-lenses.test.sh \
            tests/pre-push.test.sh \
            tests/attempts.test.sh; do
            [ -f "$t" ] || { echo "FAIL: $t no existe"; exit 1; }
            echo "Running $t"
            bash "$t" || { echo "FAIL: $t"; exit 1; }
          done

      - name: Run doctor (global check)
        run: bash setup-team-doctor.sh || true

  lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint all bash scripts
        run: |
          # Los errores bloquean. Los warnings existentes se auditan por separado
          # para no convertir deuda histórica en un falso fallo de plataforma.
          shellcheck --severity=error install-global.sh setup.sh setup-team-doctor.sh bootstrap-context.sh
          shellcheck --severity=error scripts/lib/*.sh
          shellcheck --severity=error scripts/*.sh

  validate-yaml:
    name: Validate YAML data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate stack-detectors.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('data/stack-detectors.yaml'))"

      - name: Validate skills-by-stack.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('data/skills-by-stack.yaml'))"

      - name: Validate handoff.schema.json
        run: python3 -c "import json; json.load(open('templates/handoff.schema.json'))"

  test-cross-platform:
    name: Cross-platform smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install sqlite --no-progress -y

      - name: Run complete Bash installation
        shell: bash
        run: |
          export HOME=$(mktemp -d)
          mkdir -p $HOME/.config
          bash install-global.sh
          mock=$(mktemp -d)
          cd "$mock"
          git init -q
          echo '{"name":"test","dependencies":{"react":"^18.0.0"}}' > package.json
          echo '{}' > tsconfig.json
          echo "# Test" > README.md
          bash $GITHUB_WORKSPACE/bootstrap-context.sh --target "$mock" --force
          bash $GITHUB_WORKSPACE/setup.sh --target "$mock" --force
          test "$(sqlite3 "$HOME/.config/opencode/team.db" "SELECT value FROM schema_meta WHERE key='version'")" = "0.10.1"
          test "$(sqlite3 "$mock/.opencode/context/team.db" "SELECT value FROM schema_meta WHERE key='version'")" = "0.10.1"

      - name: Run PowerShell wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-global.ps1 -DryRun -Runtime GitBash -SkallingDir $PWD
