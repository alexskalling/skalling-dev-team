name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run installer tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          bash tests/setup.test.sh
          python3 tests/dashboard-server.test.py
          bash tests/dashboard-launcher.test.sh
          bash tests/quality-priorities.test.sh
          python3 tests/routing-safety.test.py
          bash tests/bootstrap-readiness.test.sh
          bash tests/teamdb-hardening-suite.sh

      - name: Run doctor strictly against a fresh installation
        run: |
          export HOME="$(mktemp -d)"
          export SKALLING_OPENCODE_DIR="$HOME/.config/opencode"
          bash install-global.sh
          bash setup-team-doctor.sh --strict --global-only

  lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint all bash scripts
        run: |
          shellcheck --severity=warning install-global.sh setup.sh setup-team-doctor.sh bootstrap-context.sh
          shellcheck --severity=warning scripts/lib/*.sh
          shellcheck --severity=warning scripts/*.sh
          shellcheck --severity=warning scripts/hooks/*

  validate-yaml:
    name: Validate YAML data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate stack-detectors.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('data/stack-detectors.yaml'))"

      - name: Validate skills-by-stack.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('data/skills-by-stack.yaml'))"

      - name: Validate handoff.schema.json
        run: python3 -c "import json; json.load(open('templates/handoff.schema.json'))"

  test-cross-platform:
    name: Cross-platform smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install sqlite --no-progress -y

      - name: Run complete Bash installation
        shell: bash
        run: |
          export HOME=$(mktemp -d)
          mkdir -p $HOME/.config
          bash install-global.sh
          mock=$(mktemp -d)
          cd "$mock"
          git init -q
          echo '{"name":"test","dependencies":{"react":"^18.0.0"}}' > package.json
          echo '{}' > tsconfig.json
          echo "# Test" > README.md
          bash $GITHUB_WORKSPACE/bootstrap-context.sh --target "$mock" --force
          bash $GITHUB_WORKSPACE/setup.sh --target "$mock" --force
          expected="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$GITHUB_WORKSPACE/VERSION" | head -1)"
          test "$(sqlite3 "$HOME/.config/opencode/team.db" "SELECT value FROM schema_meta WHERE key='version'")" = "$expected"
          test "$(sqlite3 "$mock/.opencode/context/team.db" "SELECT value FROM schema_meta WHERE key='version'")" = "$expected"

      - name: Run PowerShell wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-global.ps1 -DryRun -Runtime GitBash -SkallingDir $PWD
