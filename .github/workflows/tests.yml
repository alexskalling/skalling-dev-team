name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run installer tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bash-version: ['3', '4', '5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests (bash ${{ matrix.bash-version }})
        run: bash tests/setup.test.sh

      - name: Run doctor (global check)
        run: bash setup-team-doctor.sh || true

  lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint all bash scripts
        run: |
          shellcheck install-global.sh setup.sh setup-team-doctor.sh bootstrap-context.sh
          shellcheck scripts/lib/*.sh
          shellcheck scripts/*.sh

  validate-yaml:
    name: Validate YAML data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate stack-detectors.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('data/stack-detectors.yaml'))"

      - name: Validate skills-by-stack.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('data/skills-by-stack.yaml'))"

      - name: Validate handoff.schema.json
        run: python3 -c "import json; json.load(open('templates/handoff.schema.json'))"

  test-cross-platform:
    name: Cross-platform smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run installer in dry-run
        shell: bash
        run: |
          # Setup fake HOME for testing
          export HOME=$(mktemp -d)
          mkdir -p $HOME/.config
          bash install-global.sh --dry-run
          bash setup-team-doctor.sh || true

      - name: Run bootstrap in mock project
        shell: bash
        run: |
          mock=$(mktemp -d)
          cd "$mock"
          echo '{"name":"test","dependencies":{"react":"^18.0.0"}}' > package.json
          echo '{}' > tsconfig.json
          echo "# Test" > README.md
          bash $GITHUB_WORKSPACE/bootstrap-context.sh --target "$mock" --force
