name: Tests

# La CI sólo necesita leer el checkout; publicar, comentar o modificar estados
# requiere una autorización explícita en otro workflow.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run installer tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install contract test dependency
        run: python3 -m pip install jsonschema pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: |
          bash tests/setup.test.sh
          python3 tests/dashboard-server.test.py
          bash tests/dashboard-launcher.test.sh
          bash tests/quality-priorities.test.sh
          python3 tests/routing-safety.test.py
          python3 tests/context-regressions.test.py
          python3 tests/installed-workflow.test.py
          python3 tests/memory-permissions.test.py
          python3 tests/agent-autonomy-contract.test.py
          python3 tests/agent-behavioral-evals.test.py
          python3 tests/permission-generation.test.py
          python3 tests/workflow-engine.test.py
          python3 tests/data-safety.test.py
          node --test tests/data-safety-plugin.test.mjs
          node --test tests/workflow-plugin.test.mjs
          python3 tests/skalling-goal.test.py
          node --test tests/skalling-goal-plugin.test.mjs
          bash tests/bootstrap-readiness.test.sh
          bash tests/teamdb-hardening-suite.sh
          bash tests/scripts-parity.test.sh

      - name: Run doctor strictly against a fresh installation
        run: |
          export HOME="$(mktemp -d)"
          export SKALLING_OPENCODE_DIR="$HOME/.config/opencode"
          bash install-global.sh
          bash setup-team-doctor.sh --strict --global-only

  lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint all bash scripts
        run: |
          shellcheck --severity=warning install-global.sh setup.sh setup-team-doctor.sh bootstrap-context.sh
          shellcheck --severity=warning scripts/lib/*.sh
          shellcheck --severity=warning scripts/*.sh
          shellcheck --severity=warning scripts/hooks/pre-commit scripts/hooks/pre-push scripts/hooks/post-merge

  validate-yaml:
    name: Validate YAML data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate stack-detectors.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('data/stack-detectors.yaml'))"

      - name: Validate skills-by-stack.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('data/skills-by-stack.yaml'))"

      - name: Validate agent permission policy
        run: python3 -c "import yaml; yaml.safe_load(open('data/agent-permissions.yaml'))"

      - name: Validate handoff.schema.json
        run: python3 -c "import json; json.load(open('templates/handoff.schema.json'))"

  test-cross-platform:
    name: Cross-platform smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install sqlite --no-progress -y

      - name: Use Homebrew SQLite on macOS (el sqlite3 del sistema no trae FTS5)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install sqlite
          echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"

      - name: Run complete Bash installation
        shell: bash
        run: |
          export HOME=$(mktemp -d)
          mkdir -p $HOME/.config
          bash install-global.sh
          mock=$(mktemp -d)
          cd "$mock"
          git init -q
          echo '{"name":"test","dependencies":{"typescript":"^5.0.0"}}' > package.json
          echo '{}' > tsconfig.json
          echo "# Test" > README.md
          bootstrap_rc=0
          bash $GITHUB_WORKSPACE/bootstrap-context.sh --target "$mock" --force || bootstrap_rc=$?
          # exit 3 = "readiness=degraded" (falta contexto/evidencia real hidratada).
          # Un mock sintético de 3 archivos nunca va a satisfacer ese chequeo — no
          # es un fallo del instalador, es el gate de v0.10.3 funcionando como
          # debe. Este smoke test valida que TeamDB se inicialice con la versión
          # correcta, no que el proyecto quede "listo para implementar". Cualquier
          # otro código de salida (falla real de instalación) sigue rompiendo el step.
          if [ "$bootstrap_rc" != "0" ] && [ "$bootstrap_rc" != "3" ]; then
            echo "bootstrap-context.sh falló con código inesperado: $bootstrap_rc" >&2
            exit "$bootstrap_rc"
          fi
          bash $GITHUB_WORKSPACE/setup.sh --target "$mock" --force
          expected="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$GITHUB_WORKSPACE/VERSION" | head -1)"
          test "$(sqlite3 "$HOME/.config/opencode/team.db" "SELECT value FROM schema_meta WHERE key='version'")" = "$expected"
          test "$(sqlite3 "$mock/.opencode/context/team.db" "SELECT value FROM schema_meta WHERE key='version'")" = "$expected"

      - name: Run PowerShell wrapper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install-global.ps1 -DryRun -Runtime GitBash -SkallingDir $PWD
