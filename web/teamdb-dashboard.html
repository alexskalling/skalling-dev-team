<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamDB</title>
<style>
  :root {
    --bg: #0d0d12;
    --surface: #16161e;
    --surface2: #1e1e2a;
    --surface3: #252535;
    --border: #2a2a3c;
    --border2: #353548;
    --text: #e2e2ec;
    --muted: #6b6b82;
    --muted2: #8888a0;
    --accent: #8b7cf8;
    --accent2: #a89cfa;
    --green: #4ade80;
    --green-dim: #2a7d4f;
    --yellow: #fbbf24;
    --yellow-dim: #7d5a10;
    --red: #f87171;
    --red-dim: #7d2a2a;
    --blue: #60a5fa;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── sidebar ── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
    position: relative;
    z-index: 10;
  }
  @media (max-width: 600px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; padding: 8px; }
    .sidebar-logo { border-bottom: none; padding: 8px; flex: 0 0 auto; }
    .sidebar-section { display: none; }
    .nav-item { flex: 0 0 auto; padding: 6px 10px; border-left: none; border-bottom: 2px solid transparent; font-size: 12px; }
    .nav-item.active { border-left: none; border-bottom-color: var(--accent); }
    .nav-item.active::before { display: none; }
    .nav-item span:not(.nav-icon) { display: none; }
    .sidebar-footer { display: none; }
  }
  .sidebar-logo {
    padding: 18px 18px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(180deg, var(--surface2), var(--surface));
  }
  .sidebar-logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), #5b4cdb);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(139, 124, 248, 0.25);
  }
  .sidebar-logo-text {
    font-size: 16px; font-weight: 700;
    color: var(--text); letter-spacing: -0.01em;
  }
  .sidebar-logo-sub {
    font-size: 10px; color: var(--muted); font-weight: 400;
    margin-top: 1px;
  }
  .sidebar-title {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 16px; font-weight: 700;
    color: var(--text); letter-spacing: -0.01em;
    background: linear-gradient(180deg, var(--surface2), var(--surface));
  }
  .sidebar-section {
    padding: 12px 18px 6px;
    font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
  }
  .nav-item {
    padding: 9px 18px 9px 15px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    user-select: none;
    display: flex; align-items: center; gap: 10px;
    position: relative;
  }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active {
    color: var(--text);
    border-left-color: var(--accent);
    background: var(--surface2);
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .nav-icon { width: 16px; height: 16px; opacity: 0.6; flex-shrink: 0; }
  .nav-item:hover .nav-icon { opacity: 0.9; }
  .nav-item.active .nav-icon { opacity: 1; color: var(--accent); }
  .sidebar-footer {
    margin-top: auto;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    background: var(--surface);
    font-family: 'SF Mono', Monaco, monospace;
  }

  /* ── main ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }
  .topbar h2 { font-size: 14px; font-weight: 600; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .project-badge {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 500; color: var(--muted2);
  }
  #refresh-btn {
    background: var(--accent); border: none;
    color: #fff; padding: 6px 14px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all 0.15s;
  }
  #refresh-btn:hover { background: var(--accent2); }
  .auto-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .auto-toggle input { accent-color: var(--accent); }

  /* ── content ── */
  .content { flex: 1; overflow-y: auto; padding: 20px 24px; color: #d0d0e0; }

  /* ── stats ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: all 0.15s;
  }
  .stat:hover { border-color: var(--border2); background: var(--surface2); }
  .stat-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 8px;
  }
  .stat-value { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── progress ── */
  .progress { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .progress-track { flex: 1; height: 5px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s; }
  .progress-fill.ok { background: var(--green); }
  .progress-fill.warn { background: var(--yellow); }
  .progress-fill.bad { background: var(--red); }
  .progress-pct { font-size: 11px; font-weight: 600; min-width: 32px; text-align: right; }

  /* ── plans ── */
  .plan-hier { display: flex; flex-direction: column; gap: 10px; }
  .plan-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .plan-hdr {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
  }
  .plan-hdr:hover { background: var(--surface2); }
  .plan-hdr-title {
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .plan-hdr-title .expand-ico { font-size: 10px; color: var(--muted); transition: transform 0.15s; }
  .plan-hdr-title .expand-ico.open { transform: rotate(90deg); }
  .plan-status {
    font-size: 10px; font-weight: 600; padding: 2px 8px;
    border-radius: 20px;
  }
  .plan-status.in_progress { background: var(--yellow-dim); color: var(--yellow); }
  .plan-status.draft { background: var(--surface3); color: var(--muted); }
  .plan-status.active { background: #1a2d4a; color: var(--blue); }
  .plan-status.completed { background: var(--green-dim); color: var(--green); }
  .plan-hdr-meta { display: flex; gap: 16px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .plan-hdr-meta span { display: flex; align-items: center; gap: 4px; }
  .plan-body { padding: 14px 16px; border-top: 1px solid var(--border); }
  .plan-body.collapsed { display: none; }
  .plan-desc { font-size: 12px; color: #c4c4d4; margin-bottom: 12px; line-height: 1.5; white-space: pre-wrap; background: var(--surface2); padding: 10px 12px; border-radius: var(--radius-sm); border-left: 3px solid var(--accent); }
  .plan-empty { padding: 20px; color: var(--muted); font-size: 13px; text-align: center; }

  /* ── features ── */
  .feat-block { margin-bottom: 8px; }
  .feat-hdr {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; cursor: pointer;
    border-radius: var(--radius-sm);
    transition: background 0.1s;
  }
  .feat-hdr:hover { background: var(--surface2); padding: 8px 6px; }
  .feat-hdr:hover .feat-title { color: var(--accent); }
  .feat-title { font-size: 13px; font-weight: 600; flex: 1; transition: color 0.1s; }
  .feat-body { padding: 6px 0 6px 0; }
  .feat-body.collapsed { display: none; }
  .feat-desc { font-size: 12px; color: #c4c4d4; margin: 4px 0 8px 0; line-height: 1.4; background: var(--bg); padding: 8px 10px; border-radius: var(--radius-sm); border-left: 2px solid var(--border); }

  /* ── task cols ── */
  .task-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 8px; }
  .task-col { background: var(--bg); border-radius: var(--radius-sm); padding: 10px; border: 1px solid var(--border); }
  .task-col-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .task-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; border: none; transition: color 0.1s; }
  .task-row:hover { color: var(--accent); }
  .task-status { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 20px; text-transform: uppercase; flex-shrink: 0; }
  .task-status.open { background: #1e1b3d; color: #a5b4fc; }
  .task-status.in_progress, .task-status.in_review { background: var(--yellow-dim); color: var(--yellow); }
  .task-status.resolved, .task-status.approved { background: var(--green-dim); color: var(--green); }
  .task-status.rejected, .task-status.abandoned { background: var(--red-dim); color: var(--red); }
  .task-owner { margin-left: auto; font-size: 10px; color: var(--muted); }

  /* ── table ── */
  .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 13px; }
  th {
    text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    background: var(--surface2); border-bottom: 1px solid var(--border);
  }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .mono { font-family: 'SF Mono', Monaco, monospace; font-size: 11px; color: var(--accent); }

  /* ── section head ── */
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .mode-btn {
    padding: 5px 12px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); transition: all 0.15s;
  }
  .mode-btn:hover { border-color: var(--border2); color: var(--text); }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── graph ── */
  #graph-content { flex: 1; overflow: hidden; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 300px; max-height: calc(100vh - 180px); }

  /* ── empty ── */
  .empty { text-align: center; padding: 40px 24px; color: var(--muted); font-size: 13px; }

  /* ── tab ── */
  .tab { display: none; }
  .tab.active { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

  /* ── loading ── */
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 100; }
  #loading.hidden { display: none; }
  #loading p { color: var(--muted); font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── misc ── */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; background: #1e1b3d; color: #a5b4fc; }
  .expand-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 12px; border-radius: 4px; transition: all 0.1s; }
  .expand-btn:hover { color: var(--accent); background: var(--surface2); }
  tr:hover .expand-btn { color: var(--text); }
  tr.detail-row { display: none; }
  tr.detail-row td { padding: 12px 16px; background: var(--surface2); border-top: 1px dashed var(--border); color: var(--text); font-size: 13px; line-height: 1.5; }
  tr.detail-row td .detail-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
  tr.detail-row td .detail-content { white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow-y: auto; background: var(--bg); padding: 10px; border-radius: var(--radius-sm); }
  tr.detail-row.open { display: table-row; }
  .flat-task-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; border-top: 1px solid var(--border); }
  .flat-task-row:hover { color: var(--accent); }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Cargando...</p>
</div>

<div class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">⊕</div>
    <div>
      <div class="sidebar-logo-text">TeamDB</div>
      <div class="sidebar-logo-sub">memory · plans · graph</div>
    </div>
  </div>

  <div class="sidebar-section">Memoria</div>
  <div class="nav-item active" data-tab="graph">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M9 7l6 0M8 9l3 6M16 9l-3 6"/></svg>
    Grafo
  </div>
  <div class="nav-item" data-tab="plans">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
    Planes
  </div>

  <div class="sidebar-section">Conceptos</div>
  <div class="nav-item" data-tab="tasks">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    Tareas
  </div>
  <div class="nav-item" data-tab="concepts">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg>
    Concepts
  </div>
  <div class="nav-item" data-tab="decisions">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    Decisiones
  </div>
  <div class="nav-item" data-tab="problems">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.7 3.86a2 2 0 00-3.4 0z"/></svg>
    Problemas
  </div>
  <div class="nav-item" data-tab="preferences">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Preferences
  </div>

  <div class="sidebar-footer" id="sidebar-db"></div>
</div>

<div class="main">
  <div class="topbar">
    <h2 id="tab-title">Dashboard</h2>
    <div class="topbar-right">
      <span id="project-name" style="color: var(--text)"></span>
      <button id="refresh-btn" onclick="render()">Refresh</button>
      <label class="autorow">
        <input type="checkbox" id="auto-check"> 30s
      </label>
    </div>
  </div>

  <div class="content">
    <div class="tab" id="tab-plans"></div>
    <div class="tab" id="tab-tasks"></div>
    <div class="tab active" id="tab-graph"></div>
    <div class="tab" id="tab-concepts"></div>
    <div class="tab" id="tab-decisions"></div>
    <div class="tab" id="tab-problems"></div>
    <div class="tab" id="tab-preferences"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });

let current = 'graph';
let autoTimer = null;
let apiData = {};

const TABS = ['plans','tasks','graph','concepts','decisions','problems','preferences'];
const TITLES = { plans:'Planes', tasks:'Tareas', graph:'Grafo', concepts:'Concepts', decisions:'Decisiones', problems:'Problemas', preferences:'Preferences' };

document.querySelectorAll('.nav-item').forEach(el => {
  el.onclick = () => showTab(el.dataset.tab);
});

function showTab(id) {
  current = id;
  TABS.forEach(t => document.getElementById('tab-' + t).classList.toggle('active', t === id));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === id));
  document.getElementById('tab-title').textContent = TITLES[id];
  render();
}

document.getElementById('auto-check').onchange = e => {
  if (e.target.checked) autoTimer = setInterval(render, 30000);
  else { clearInterval(autoTimer); autoTimer = null; }
};

async function api(path) {
  if (apiData[path]) return apiData[path];
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    const data = await res.json();
    apiData[path] = data;
    return data;
  } catch { return null; }
}

// Heartbeat para mantener el server vivo mientras el browser está abierto
setInterval(() => { fetch('/api/heartbeat').catch(() => {}); }, 60000);

async function render() {
  apiData = {};
  window['render_' + current]();
}

// ── Dashboard ───────────────────────────────────────────────
async function render_dashboard() {
  const s = await api('/api/stats');
  if (!s) return render_error();
  const pct = s.tasks_pct || 0;
  const pctClass = pct >= 70 ? 'ok' : pct >= 40 ? 'warn' : 'bad';
  const pctColor = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--yellow)' : 'var(--red)';

  document.getElementById('tab-dashboard').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-label">Concepts</div><div class="stat-value" style="color:var(--accent)">${s.concepts||0}</div></div>
      <div class="stat"><div class="stat-label">Decisiones</div><div class="stat-value" style="color:var(--accent)">${s.decisions||0}</div></div>
      <div class="stat"><div class="stat-label">Planes</div><div class="stat-value" style="color:var(--accent)">${s.plans||0}</div></div>
      <div class="stat">
        <div class="stat-label">Tareas</div>
        <div class="stat-value" style="color:${pctColor}">${s.tasks_done||0}/${s.tasks_total||0}</div>
        <div class="progress"><div class="progress-track"><div class="progress-fill ${pctClass}" style="width:${pct}%"></div></div></div>
        <div class="stat-sub">${pct}% completadas</div>
      </div>
      <div class="stat"><div class="stat-label">Problemas</div><div class="stat-value" style="color:var(--red)">${s.problems||0}</div></div>
      <div class="stat"><div class="stat-label">Links</div><div class="stat-value" style="color:var(--green)">${s.links||0}</div></div>

function renderMemoriaGraph(mnodes, medges) {
  const container = document.getElementById('d3-container');
  if (!container) return;
  container.innerHTML = '';

  const width = container.clientWidth || 800;
  const height = Math.max(container.clientHeight || 400, 400);
  console.log('renderMemoriaGraph', { width, height, nodes: mnodes.length, edges: medges.length });

  const typeColors = {concept: '#7c6af7', decision: '#fbbf24', feature: '#4ade80'};

  const svg = d3.select(container).append('svg').attr('width', width).attr('height', height);
  svg.append('g').attr('class', 'edges');
  svg.append('g').attr('class', 'nodes');

  svg.call(d3.zoom().scaleExtent([0.1, 4]).on('zoom', function(event) {
    svg.select('.edges').attr('transform', event.transform);
    svg.select('.nodes').attr('transform', event.transform);
  }));

  const sim = d3.forceSimulation(mnodes)
    .force('link', d3.forceLink(medges).id(d => d.id).distance(100))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collision', d3.forceCollide().radius(30));

  const link = svg.select('.edges').selectAll('line').data(medges).join('line')
    .attr('stroke', '#3a3a4a').attr('stroke-width', 1.5)
    .attr('stroke-opacity', 0.7);

  const linkLabels = svg.select('.edges').selectAll('text').data(medges).join('text')
    .attr('fill', '#6b6b80').attr('font-size', '9px').attr('text-anchor', 'middle')
    .text(d => d.link_type);

  const node = svg.select('.nodes').selectAll('g').data(mnodes).join('g')
    .call(d3.drag().on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle').attr('r', 12)
    .attr('fill', d => typeColors[d.type] || '#6b6b80')
    .attr('stroke', '#fff').attr('stroke-width', 2);

  node.append('text').attr('dx', 16).attr('dy', 4)
    .attr('fill', '#d4d4dc').attr('font-size', '12px')
    .attr('font-family', 'monospace').text(d => d.slug);

  node.append('title').text(d => `${d.slug} (${d.type})`);

  let tickCount = 0;
  sim.on('tick', () => {
    tickCount++;
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    linkLabels
      .attr('x', d => (d.source.x + d.target.x)/2)
      .attr('y', d => (d.source.y + d.target.y)/2);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
    if (tickCount === 1) console.log('First tick node pos:', mnodes[0].x, mnodes[0].y);
  });
}

async function render_graph_codigo() {

// ── D3 Graph ────────────────────────────────────────────────
function renderD3Graph(nodes, edges) {
  const container = document.getElementById('d3-container');
  if (!container) return;
  container.innerHTML = '';

  const width = container.clientWidth || 800;
  const height = Math.max(container.clientHeight || 500, 400);

  const svg = d3.select(container).append('svg')
    .attr('width', width).attr('height', height);

  svg.append('g').attr('class', 'edges');
  svg.append('g').attr('class', 'nodes');

  const zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', (event) => {
    svg.select('.edges').attr('transform', event.transform);
    svg.select('.nodes').attr('transform', event.transform);
  });
  svg.call(zoom);

  const validEdges = edges.filter(e => e.from && e.to).map(e => ({source: e.from, target: e.to}));

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(validEdges).id(d => d.path).distance(60))
    .force('charge', d3.forceManyBody().strength(-120))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(20));

  const link = svg.select('.edges').selectAll('line')
    .data(validEdges).join('line')
    .attr('stroke', '#3a3a4a').attr('stroke-width', 1.5);

  const langColors = {
    typescript: '#7c6af7', javascript: '#fbbf24',
    python: '#4ade80', rust: '#f87171',
    go: '#60a5fa', java: '#fb923c',
  };

  const node = svg.select('.nodes').selectAll('g')
    .data(nodes).join('g')
    .call(d3.drag().on('start', (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }).on('drag', (event, d) => {
      d.fx = event.x; d.fy = event.y;
    }).on('end', (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }));

  node.append('circle').attr('r', 8)
    .attr('fill', d => langColors[d.lang] || '#6b6b80')
    .attr('stroke', '#fff').attr('stroke-width', 1.5);

  node.append('text').attr('dx', 12).attr('dy', 4)
    .attr('fill', '#d4d4dc').attr('font-size', '11px')
    .attr('font-family', 'monospace')
    .text(d => d.path.split('/').pop());

  node.append('title').text(d => d.path);

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// ── Plans ─────────────────────────────────────────────────
 async function render_plans() {
  const hier = await api('/api/plans-hierarchy');
  if (hier && hier.length) {
    const allFeatures = hier.flatMap(p => p._features || []);
    const allTasks = hier.flatMap(p => (p._features || []).flatMap(f => f._children || []));
    const openTasks = allTasks.filter(t => ['open'].includes(t.status));
    const progTasks = allTasks.filter(t => ['in_progress', 'in_review'].includes(t.status));
    const doneTasks = allTasks.filter(t => ['resolved', 'approved'].includes(t.status));
    const statsHtml = `
      <div class="stats" style="margin-bottom:20px">
        <div class="stat"><div class="stat-label">Planes</div><div class="stat-value" style="color:var(--accent)">${hier.length}</div></div>
        <div class="stat"><div class="stat-label">Funcionalidades</div><div class="stat-value" style="color:var(--accent)">${allFeatures.length}</div></div>
        <div class="stat"><div class="stat-label">Tareas</div><div class="stat-value" style="color:var(--accent)">${allTasks.length}</div></div>
        <div class="stat"><div class="stat-label">Abiertas</div><div class="stat-value" style="color:#a5b4fc">${openTasks.length}</div></div>
        <div class="stat"><div class="stat-label">En Progreso</div><div class="stat-value" style="color:#fbbf24">${progTasks.length}</div></div>
        <div class="stat"><div class="stat-label">Terminadas</div><div class="stat-value" style="color:var(--green)">${doneTasks.length}</div></div>
      </div>`;
    document.getElementById('tab-plans').innerHTML = statsHtml + '<div class="plan-hier">' + hier.map(renderPlanBlock).join('') + '</div>';
    return;
  }
  const plans = await api('/api/plans');
  document.getElementById('tab-plans').innerHTML = (plans && plans.length)
    ? '<div class="plan-hier">' + (await Promise.all(plans.map(renderPlanCardFlat))) + '</div>'
    : '<div class="empty">Sin planes</div>';
}

function renderPlanBlock(p) {
  const featCount = p._features ? p._features.length : 0;
  const taskCount = p._flat_tasks ? p._flat_tasks.length : 0;
  const totalTasks = (p._features || []).reduce((s, f) => s + (f._children ? f._children.length : 0), 0) + taskCount;
  const doneTasks = (p._features || []).reduce((s, f) => s + (f._children ? f._children.filter(t => t.status === 'resolved').length : 0), 0);
  const pct = totalTasks ? Math.round(doneTasks / totalTasks * 100) : 0;
  const cls = pct >= 70 ? 'ok' : pct >= 40 ? 'warn' : 'bad';

  return `
    <div class="plan-block">
      <div class="plan-hdr" onclick="togglePlan('${p.slug}')">
        <div class="plan-hdr-title">
          <span class="expand-ico" id="ico_${esc(p.slug)}">&#9658;</span>
          ${esc(p.title || p.slug)}
          <span class="plan-status ${p.status||'draft'}">${p.status||'draft'}</span>
        </div>
        <div class="plan-hdr-meta">
          ${featCount ? `<span>${featCount} funcionalidades</span>` : ''}
          ${totalTasks ? `<span>${totalTasks} tareas</span>` : ''}
          ${totalTasks ? `<span>${pct}%</span>` : ''}
        </div>
      </div>
      <div class="plan-body" id="body_${esc(p.slug)}">
        ${(p.body_md || p.description || p.design_md) ? `<div class="plan-desc">${esc(p.body_md || p.description || p.design_md)}</div>` : ''}
        ${(p._features || []).map(f => renderFeatureBlock(f)).join('')}
        ${(p._flat_tasks || []).map(t => renderFlatTaskRow(t)).join('')}
        ${!(p.body_md || p.description || p.design_md) && !(p._features || []).length && !(p._flat_tasks || []).length ? '<div class="plan-empty">Sin funcionalidades ni tareas</div>' : ''}
      </div>
    </div>`;
}

function renderFeatureBlock(f) {
  const tasks = f._children || [];
  const openTasks = tasks.filter(t => ['open'].includes(t.status));
  const progTasks = tasks.filter(t => ['in_progress', 'in_review'].includes(t.status));
  const doneTasks = tasks.filter(t => ['resolved', 'approved'].includes(t.status));
  const deadTasks = tasks.filter(t => ['rejected', 'abandoned'].includes(t.status));

  return `
    <div class="feat-block">
      <div class="feat-hdr" onclick="toggleFeat('${f.id}')">
        <span class="expand-ico" id="fico_${f.id}">&#9658;</span>
        <span class="feat-title">${esc(f.title || f.slug)}</span>
        <span class="task-status ${f.status||'open'}">${f.status||'open'}</span>
        ${tasks.length ? `<span style="font-size:11px;color:var(--muted)">${doneTasks.length}/${tasks.length}</span>` : ''}
      </div>
      <div class="feat-body" id="fbody_${f.id}">
        ${f.description ? `<div class="feat-desc">${esc(f.description)}</div>` : ''}
        ${f.body_md ? `<div class="feat-desc" style="margin-left:0;background:var(--bg);padding:8px;border-radius:6px;white-space:pre-wrap">${esc(f.body_md)}</div>` : ''}
        ${tasks.length ? `
        <div class="task-cols">
          ${openTasks.length ? `<div class="task-col"><div class="task-col-label">Abiertas (${openTasks.length})</div>${openTasks.map(t => renderWipTaskRow(t)).join('')}</div>` : ''}
          ${progTasks.length ? `<div class="task-col"><div class="task-col-label">En Progreso (${progTasks.length})</div>${progTasks.map(t => renderWipTaskRow(t)).join('')}</div>` : ''}
          ${doneTasks.length ? `<div class="task-col"><div class="task-col-label">Terminadas (${doneTasks.length})</div>${doneTasks.map(t => renderWipTaskRow(t)).join('')}</div>` : ''}
          ${deadTasks.length ? `<div class="task-col"><div class="task-col-label">Descartadas (${deadTasks.length})</div>${deadTasks.map(t => renderWipTaskRow(t)).join('')}</div>` : ''}
        </div>` : `<div style="font-size:12px;color:#8888a0;padding:4px 0">Sin tareas</div>`}
      </div>
    </div>`;
}

function renderWipTaskRow(t) {

            ${p.body_md ? `<div class="detail-label">Body</div><div class="detail-content">${esc(p.body_md)}</div>` : ''}
            ${p.description_md ? `<div class="detail-label" style="margin-top:8px">Description</div><div class="detail-content">${esc(p.description_md)}</div>` : ''}
            ${!p.body_md && !p.description_md ? '<span style="color:var(--muted);font-size:12px">Sin contenido adicional</span>' : ''}
          </td>
        </tr>`).join('')}</tbody>
    </table></div>` : '<div class="empty">Sin preferences</div>';
}

// ── Tasks ──────────────────────────────────────────────────
async function render_tasks() {
  const data = await api('/api/tasks');
  if (!data) return;

  const byStatus = { open: [], in_progress: [], in_review: [], resolved: [], rejected: [] };
  for (const t of data) {
    const s = byStatus[t.status] || byStatus['open'];
    s.push(t);
  }

  const cols = [
    { key: 'open', label: 'Abiertas', cls: 'open' },
    { key: 'in_progress', label: 'En Progreso', cls: 'in_progress' },
    { key: 'in_review', label: 'En Review', cls: 'in_review' },
    { key: 'resolved', label: 'Resueltas', cls: 'resolved' },
    { key: 'rejected', label: 'Rechazadas', cls: 'rejected' },
  ].filter(c => (byStatus[c.key] || []).length > 0);

  if (!cols.length) {
    document.getElementById('tab-tasks').innerHTML = '<div class="empty">Sin tareas</div>';
    return;
  }

  document.getElementById('tab-tasks').innerHTML = `
    <div class="stats" style="margin-bottom:20px">
      <div class="stat"><div class="stat-label">Total</div><div class="stat-value" style="color:var(--accent)">${data.length}</div></div>
      <div class="stat"><div class="stat-label">Abiertas</div><div class="stat-value" style="color:#a5b4fc">${(byStatus['open']||[]).length}</div></div>
      <div class="stat"><div class="stat-label">En Progreso</div><div class="stat-value" style="color:#fbbf24">${(byStatus['in_progress']||[]).length}</div></div>
      <div class="stat"><div class="stat-label">Resueltas</div><div class="stat-value" style="color:var(--green)">${(byStatus['resolved']||[]).length}</div></div>
    </div>
    <div class="task-cols" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
      ${cols.map(c => `
        <div class="task-col">
          <div class="task-col-label" style="color:${c.key==='open'?'#a5b4fc':c.key==='in_progress'||c.key==='in_review'?'#fbbf24':c.key==='resolved'?'var(--green)':'var(--red)'}">${c.label} (${byStatus[c.key].length})</div>
          ${byStatus[c.key].map(t => `
            <div class="task-row">
              <span style="flex:1;font-size:13px">${esc(t.title||t.slug)}</span>
              ${t.owner ? `<span class="task-owner">${esc(t.owner)}</span>` : ''}
            </div>`).join('')}
        </div>`).join('')}
    </div>`;
}

// ── Toggle ─────────────────────────────────────────────────
function togglePlan(slug) {
  const body = document.getElementById('body_' + slug);
  const ico = document.getElementById('ico_' + slug);
  if (!body) return;
  const open = body.classList.toggle('collapsed');
  ico.classList.toggle('open', !open);
}

function toggleFeat(id) {
  const body = document.getElementById('fbody_' + id);
  const ico = document.getElementById('fico_' + id);
  if (!body) return;
  const open = body.classList.toggle('collapsed');
  ico.classList.toggle('open', !open);
}

function toggleDetail(id) {
  const row = document.getElementById(id);
  if (!row) return;
  const open = row.classList.toggle('open');
  row.previousElementSibling.querySelector('.expand-btn').textContent = open ? '▼' : '▶';
}

// ── Error ─────────────────────────────────────────────────
function render_error() {
  document.getElementById('loading').innerHTML = `
    <p style="color:var(--red)">No se pudo cargar datos.</p>
    <p style="color:var(--muted);font-size:12px">Verific&aacute; que el servidor est&eacute; corriendo.</p>
  `;
}

// ── Utils ─────────────────────────────────────────────────
function esc(v) { return v == null ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(v) { if (!v) return '—'; try { return new Date(v).toLocaleDateString('es-AR'); } catch { return v; } }

// ── Boot ──────────────────────────────────────────────────
async function boot() {
  try {
    const info = await api('/api/info');
    if (!info) throw new Error('no info');
    document.getElementById('sidebar-db').textContent = info.project || 'team.db';
    document.getElementById('project-name').textContent = info.project || '';
    document.getElementById('loading').classList.add('hidden');
    render();
  } catch(e) {
    render_error();
  }
}

boot();
</script>
</body>
</html>
